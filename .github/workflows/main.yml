name: Auto Update FinSEO Site

on:
  schedule:
    # Запуск каждый день в 19:05 МСК (16:05 UTC) после закрытия торгов на Мосбирже
    - cron: '5 16 * * *'
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Проверяем код репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Устанавливаем библиотеки
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Запуск нашего робота-парсера
      run: python run_finseo.py

    - name: Авто-коммит обновленного index.html обратно в репозиторий
      run: |
        git config --global user.name "FinSeoBot"
        git config --global user.email "bot@finseo.ru"
        git add index.html
        git commit -m "Автоматическое обновление данных ОФЗ" || echo "Нет изменений для коммита"
        git push
